<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Página temporariamente fora do ar.">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#1f1111">
  <title>404 | Unidos de Bangu</title>
  <link rel="shortcut icon" href="favicon/favicon.ico" type="image/x-icon">
  <style>
    :root {
      --bg-1: #2b0d0d;
      --bg-2: #120909;
      --text: #fdf6f2;
      --muted: #f0d8cf;
      --accent: #f3bd47;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: "Be Vietnam Pro", "Segoe UI", Tahoma, sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 15% 20%, rgba(243, 189, 71, 0.2), transparent 35%),
        radial-gradient(circle at 85% 85%, rgba(139, 0, 0, 0.5), transparent 40%),
        linear-gradient(150deg, var(--bg-1), var(--bg-2));
      display: grid;
      place-items: center;
      padding: 1.5rem;
      overflow: hidden;
    }

    .page-content {
      width: min(680px, 100%);
      padding: clamp(1.2rem, 4vw, 2.2rem);
      text-align: center;
    }

    .code {
      display: inline-block;
      font-size: clamp(2.4rem, 8vw, 4.4rem);
      line-height: 1;
      font-weight: 800;
      color: var(--accent);
      letter-spacing: 0.06em;
      margin-bottom: 0.45rem;
    }

    h1 {
      font-size: clamp(1.25rem, 4vw, 2rem);
      margin-bottom: 0.55rem;
    }

    p {
      color: var(--muted);
      margin-bottom: 1.2rem;
    }

    .gif-wrap {
      border-radius: 16px;
      overflow: hidden;
      max-width: 460px;
      margin: 0 auto;
    }

    .gif-wrap img {
      width: 100%;
      height: auto;
      display: block;
      max-height: 48vh;
      object-fit: contain;
    }

    .hint {
      margin-top: 1rem;
      font-size: 0.9rem;
      color: #f7c7ae;
    }

    @media (max-width: 768px) {
      body {
        overflow: hidden;
      }

      .page-content {
        padding: 1rem 0.25rem;
      }

      .gif-wrap img {
        max-height: 44vh;
      }
    }
  </style>
</head>
<body>
  <main class="page-content" role="main" aria-labelledby="status-title">
    <span class="code" aria-hidden="true">404</span>
    <h1 id="status-title">Página temporariamente fora do ar</h1>
    <p>Estamos ajustando tudo por aqui. Em breve a home volta ao normal.</p>

    <div class="gif-wrap">
      <img
        src="https://media4.giphy.com/media/v1.Y2lkPTc5MGI3NjExOTBkMHFjdzh0c2U1azNyY3Mwc2lnMTczNnJ4bTNvZXM1dGpuajI3cyZlcD12MV9naWZzX3NlYXJjaCZjdD1n/aACeieARpEEE/giphy.gif"
        alt="Homem das cavernas tentando ligar fios e tomando choque"
      >
    </div>

    <p class="hint">Site em manutenção temporária.</p>
  </main>
</body>
</html>
